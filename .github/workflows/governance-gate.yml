name: Governance Gate

# Enforces ConvertCCY's standing rules mechanically, not just by review
# discipline. Every push to main and every pull request targeting main must
# pass all five checks below before the change is considered safe to merge.
#
# This workflow only reads the repository and runs local, dependency-free
# Python scripts already committed under scripts/. It makes no network
# calls, requires no secrets, and has no write permissions beyond the
# default read-only GITHUB_TOKEN.
#
# To make this an unbypassable merge gate (not just a visible check), the
# repository owner must mark "Governance Gate" as a required status check
# in Settings -> Branches -> Branch protection rules for `main`. This
# workflow file alone reports status; branch protection is what blocks a
# merge on failure, and that setting cannot be applied from a workflow file.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rules content & schema gate (validate_rules.py)
        run: python3 scripts/validate_rules.py data/rules/

      - name: Lifecycle separation gate (rules_quality_gate.py)
        run: python3 scripts/rules_quality_gate.py --site-root .

      - name: Coverage intake guard rail (validate_coverage_intake.py)
        run: python3 scripts/validate_coverage_intake.py

      - name: Generated-artifact drift guard (validate_generated_artifacts.py)
        run: python3 scripts/validate_generated_artifacts.py

      - name: Site hygiene — JSON, target=_blank, preview leaks (validate_site_hygiene.py)
        run: python3 scripts/validate_site_hygiene.py

      - name: Instrument classification gate (validate_instrument_classification.py)
        # SEO-A4.1: authoritative taxonomy for all 170 codes, fail-closed
        # status combinations, anchored special codes, legacy-label
        # reconciliation, and derived policy-matrix drift. Runs before the
        # generator-dependent gates below.
        run: python3 scripts/validate_instrument_classification.py

      - name: Historical & legacy instrument gate (validate_historical_instruments.py)
        # SEO-A4.2: policy-resolved historical/legacy pair pages carry no
        # LIVE/SNAPSHOT state, no rate runtime, only verified and labelled
        # figures, no provider-alias leak, aligned FAQ/JSON-LD, and match
        # the generator output.
        run: python3 scripts/validate_historical_instruments.py

      - name: ISO 4217 standards-special gate (validate_standards_special_codes.py)
        # SEO-A4.3: XTS/XXX pair pages are noindex,follow self-canonical standards
        # references with no rate state, absent from the sitemap; hubs indexable
        # and registry-cited; no sitemap URL points to noindex content.
        run: python3 scripts/validate_standards_special_codes.py

      - name: Pair internal-link graph gate (validate_pair_link_graph.py)
        # SEO-A2: every pair page reachable from index.html via <a href>
        # within 3 clicks, no reverse-pair-only 2-cycles, every pair linked
        # by its currency hubs, no broken internal links.
        run: python3 scripts/validate_pair_link_graph.py

      - name: Rate snapshot & static pair-rate gate (validate_rate_snapshot.py)
        # SEO-A3: snapshot schema/data validity, data/public copies identical,
        # every unsupported code classified, and every pair page's marked
        # static-rate regions exactly match the snapshot derivation. Staleness
        # is reported, not enforced (CI must not fail only because time passed).
        run: python3 scripts/validate_rate_snapshot.py

      - name: Country pipeline gate (validate_country_pipeline.py)
        # Staging packs: publication readiness is informational.
        # Packs that already claim verified/published or indexing_allowed=true
        # are automatically held to --require-publish-ready semantics inside
        # the validator (Publication Gate becomes blocking for those slugs).
        run: python3 scripts/validate_country_pipeline.py

      - name: Source intake gate (validate_source_intake.py)
        # Phase 2 M1 opt-in: runs for packs with evidence_excerpts.json.
        # Regenerates report in-memory and fails on intake_report drift.
        run: python3 scripts/validate_source_intake.py --check-drift

      - name: Claim extraction gate (validate_claim_extraction.py)
        # Phase 2 M2 opt-in: runs for packs with candidate_claims.json.
        # Regenerates report in-memory and fails on claim_extraction_report drift.
        run: python3 scripts/validate_claim_extraction.py --check-drift

      - name: Human claim review gate (validate_human_claim_review.py)
        # Phase 2 M2.5 opt-in: runs for packs with human_claim_review.json.
        # Infrastructure PASS with pending reviews is allowed; milestone
        # completion is a later gate (--require-milestone-complete).
        run: python3 scripts/validate_human_claim_review.py --check-drift

      - name: Human claim review tests (tests.test_human_claim_review)
        run: python3 -m unittest discover -s tests

      - name: Pipeline milestone scope gate (validate_pipeline_milestone_scope.py)
        # Blocks M1/M2/M2.5 PRs from also rewriting claims/bindings/rules.
        # --committed-only inspects origin/main...HEAD only. Earlier steps may
        # write runtime artifacts (e.g. Phase 1 review_report.json) into the
        # worktree; those must not be treated as PR scope.
        run: python3 scripts/validate_pipeline_milestone_scope.py --base origin/main --committed-only
        if: github.event_name == 'pull_request'
